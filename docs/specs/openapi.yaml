openapi: 3.1.0
info:
  title: 실버헬퍼 API
  version: 0.2.0
  description: |
    보호자(자녀)를 위한 부모님 복지 혜택 안내 API.

    공통 규칙
    - 모든 응답은 `ApiResponse` 형식으로 감싼다. 성공이면 `success=true`, `data`에 결과. 실패면 `success=false`, `error`에 코드와 메시지.
    - 목록은 `PageResponse`로 감싼다. `page`는 0부터 시작한다.
    - 시각은 ISO-8601 (`2026-10-13T04:00:00+09:00`), 날짜는 `yyyy-MM-dd`.
    - 사용자에게 보여주는 혜택에는 항상 `sourceUrl`과 `basis`(기준일 정보)가 들어 있다.
    - 혜택 목록·매칭은 같은 사업을 묶은 그룹(`benefit_group`)당 대표 1건만 돌려준다 (ADR 0002 §3).
    - 공개 조건: 원천 상태 `ACTIVE` + AI 검증 완료(`verified_hash` 있음). 검증 전 혜택은 목록·상세·매칭 어디에도 나오지 않는다.
    - `/api/admin/**`는 JWT의 ADMIN 역할이 필요하다. 인증이 없으면 401, 권한이 없으면 403이다.

    관련 문서: `docs/adr/0002-db-schema.md`, `docs/adr/0003-auth.md`, `docs/adr/0004-notification-rag.md`, `docs/specs/public-api.md`
servers:
  - url: http://localhost:8080
    description: 로컬 (프론트 개발 서버는 `/api`를 여기로 프록시)

tags:
  - name: benefits
    description: 혜택 조회
  - name: matching
    description: 부모님 프로필 기반 매칭
  - name: codes
    description: 화면용 코드·지역 목록
  - name: admin-reviews
    description: 관리자 검토 대기열
  - name: auth
    description: 로그인과 토큰
  - name: me
    description: 회원과 부모님 프로필
  - name: notifications
    description: 알림 설정
  - name: chat
    description: 공개 혜택 근거 기반 챗봇

paths:
  /api/benefits:
    get:
      tags: [benefits]
      operationId: listBenefits
      security: []
      summary: 혜택 목록 (필터)
      description: |
        필터는 모두 선택 사항이고 AND로 결합한다.
        - `age`: 나이가 `[minAge, maxAge]` 범위 안이거나 연령 조건이 없는 혜택
        - `ctpvName`/`sggName`: 전국 사업(지역 없음) + 해당 시도 사업(시군구 없음) + 해당 시군구 사업
        - `ltcGrade`: 장기요양 등급을 요구하지 않는 혜택 + 그 등급을 허용하는 혜택
        - `incomeMedianPct`: 소득 상한이 없거나 상한 이상인 혜택
        - `theme`: 관심주제 코드 (`/api/codes`의 THEME)
      parameters:
        - $ref: '#/components/parameters/Age'
        - $ref: '#/components/parameters/CtpvName'
        - $ref: '#/components/parameters/SggName'
        - $ref: '#/components/parameters/LtcGrade'
        - $ref: '#/components/parameters/IncomeMedianPct'
        - name: theme
          in: query
          description: 관심주제 코드. 여러 개면 쉼표로 구분, OR
          schema: { type: string, example: '120,010' }
        - name: keyword
          in: query
          description: 서비스명·요약 부분 일치
          schema: { type: string, maxLength: 50, example: 장기요양 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          schema:
            type: string
            enum: [RELEVANCE, NAME, RECENT]
            default: RELEVANCE
          description: RELEVANCE = 지역 사업 우선, 그다음 이름순. RECENT = 원천 수정일 최신순
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            required: [content]
                            properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/BenefitSummary' }
              example:
                success: true
                data:
                  content:
                    - id: 101
                      groupId: 55
                      name: 장기요양 본인부담금 감경
                      summary: 노인장기요양보험 장기요양급여 이용자 중 건강보험료순위 50%이하자 및 기타의료급여 수급권자 등에게 본인부담금을 감경하여 서비스 이용부담을 완화합니다.
                      source: NATIONAL
                      sourceUrl: https://www.bokjiro.go.kr/ssis-tbu/twataa/wlfareInfo/moveTWAT52011M.do?wlfareInfoId=WLF00001177&wlfareInfoReldBztpCd=01
                      agencyName: 보건복지부 요양보험제도과
                      region: null
                      provisionType: 기타
                      supportCycle: 월
                      onlineApply: false
                      tags:
                        - { type: LIFE, code: '006', name: 노년 }
                        - { type: THEME, code: '120', name: 보호·돌봄 }
                      eligibility:
                        minAge: null
                        maxAge: null
                        ltcRequired: true
                        ltcGrades: [1, 2, 3, 4, 5, 6]
                        incomeMaxMedianPct: null
                        requiresBasicLivelihood: null
                        requiresNearPoverty: null
                        requiresBasicPension: null
                        requiresDisability: null
                        requiresVeteran: null
                        requiresSingleHousehold: null
                        conditionsSummary: 장기요양 급여 이용자 중 건강보험료 순위 50% 이하 또는 의료급여 수급자
                      basis:
                        lastCollectedAt: '2026-10-13T04:00:00+09:00'
                        sourceModifiedAt: null
                        baseYear: 2026
                        updatePending: false
                  page: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
                error: null
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/benefits/{id}:
    get:
      tags: [benefits]
      operationId: getBenefit
      security: []
      summary: 혜택 상세
      description: 그룹에 속한 다른 원천의 같은 사업은 `otherSources`로 함께 준다.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BenefitDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/benefits/match:
    post:
      tags: [matching]
      operationId: matchBenefits
      security: []
      summary: 부모님 프로필로 받을 수 있는 혜택 찾기
      description: |
        프로필은 저장하지 않는다(로그인은 Phase 2). 판정 규칙:
        - 혜택의 조건이 NULL이면 조건 없음 → 통과
        - 조건이 있고 프로필 값이 그 조건을 만족 → 통과
        - 조건이 있고 프로필 값이 조건을 어김 → 제외 (응답에 안 나옴)
        - 조건이 있는데 프로필 값이 null(모름) → `CHECK_NEEDED`
        - 지역은 `/api/benefits`와 같은 규칙. 지역이 다르면 제외

        `matchLevel`
        - `ELIGIBLE`: 확인된 모든 조건 통과
        - `CHECK_NEEDED`: 프로필에 없는 정보 때문에 확인 필요. `checkItems`에 무엇을 확인해야 하는지
        정렬: ELIGIBLE 먼저, 그다음 지역 사업 우선, 이름순.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentProfile' }
            example:
              age: 78
              ctpvName: 서울특별시
              sggName: 강서구
              ltcGrade: 3
              incomeMedianPct: 45
              basicLivelihood: false
              nearPoverty: null
              basicPension: true
              disability: false
              veteran: false
              livingAlone: true
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            required: [content, summary]
                            properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/MatchResult' }
                              summary:
                                type: object
                                required: [eligibleCount, checkNeededCount]
                                properties:
                                  eligibleCount: { type: integer }
                                  checkNeededCount: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/codes:
    get:
      tags: [codes]
      operationId: listCodes
      security: []
      summary: 코드 목록 (생애주기, 가구유형, 관심주제, 장기요양 등급)
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [LIFE, HOUSEHOLD, THEME, LTC_GRADE]
                        properties:
                          LIFE: { type: array, items: { $ref: '#/components/schemas/Code' } }
                          HOUSEHOLD: { type: array, items: { $ref: '#/components/schemas/Code' } }
                          THEME: { type: array, items: { $ref: '#/components/schemas/Code' } }
                          LTC_GRADE: { type: array, items: { $ref: '#/components/schemas/Code' } }
              example:
                success: true
                data:
                  LIFE: [{ code: '006', name: 노년 }]
                  HOUSEHOLD: [{ code: '050', name: 저소득 }]
                  THEME: [{ code: '120', name: 보호·돌봄 }]
                  LTC_GRADE:
                    - { code: '1', name: 1등급 }
                    - { code: '6', name: 인지지원등급 }
                error: null

  /api/regions:
    get:
      tags: [codes]
      operationId: listRegions
      security: []
      summary: 시도·시군구 목록
      description: 수집된 혜택에 나오는 지역에서 만든다(행정구역 개편을 따라가기 위해 코드표를 쓰지 않음).
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [ctpvName, sggNames]
                          properties:
                            ctpvName: { type: string, example: 서울특별시 }
                            sggNames: { type: array, items: { type: string }, example: [강서구, 노원구] }

  /api/admin/reviews:
    get:
      tags: [admin-reviews]
      operationId: listReviews
      summary: 검토 대기열 목록
      security: [{ admin: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReviewStatus' }
          description: 기본 PENDING
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/ReviewReason' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 오래된 순
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            required: [content]
                            properties:
                              content:
                                type: array
                                items: { $ref: '#/components/schemas/ReviewSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/reviews/{id}:
    get:
      tags: [admin-reviews]
      operationId: getReview
      summary: 검토 항목 상세 (원문, 두 모델 결과, 차이)
      security: [{ admin: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReviewDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/reviews/{id}/approve:
    post:
      tags: [admin-reviews]
      operationId: approveReview
      summary: 승인
      description: |
        `eligibility`를 확정 조건으로 저장하고(`benefit_eligibility`), 혜택의 `verified_hash`를 검토 대상 원문의 해시로 바꾼다.
        `baseExtractionId`는 기준으로 삼은 추출 결과(Claude 또는 GPT). `eligibility`를 생략하면 그 결과를 그대로 쓴다.
        `GROUP_CANDIDATE` 사유는 승인하면 두 혜택을 같은 그룹으로 합친다(`eligibility` 무시).
      security: [{ admin: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseExtractionId: { type: [integer, 'null'], format: int64 }
                eligibility:
                  oneOf:
                    - $ref: '#/components/schemas/Eligibility'
                    - type: 'null'
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: 처리 후 검토 항목
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReviewSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/reviews/{id}/reject:
    post:
      tags: [admin-reviews]
      operationId: rejectReview
      summary: 반려
      description: 확정 조건을 바꾸지 않는다. 혜택은 이전 상태(공개 중이면 이전 조건으로 계속 공개, 미공개면 미공개) 그대로.
      security: [{ admin: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: 처리 후 검토 항목
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReviewSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/dev/login:
    post:
      tags: [auth]
      operationId: devLogin
      summary: local 프로필 전용 개발 로그인 (운영에서는 404)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/auth/exchange:
    post:
      tags: [auth]
      operationId: exchangeAuthCode
      summary: OAuth 성공 후 일회용 코드를 액세스 토큰과 리프레시 쿠키로 교환
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshAuth
      summary: 리프레시 쿠키를 회전하고 새 액세스 토큰 발급
      security: []
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 리프레시 토큰 폐기
      security: []
      responses:
        '204': { description: 로그아웃 완료 및 쿠키 제거 }

  /api/me:
    get:
      tags: [me]
      operationId: getMe
      security: [{ bearerAuth: [] }]
      summary: 내 정보
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/profiles:
    get:
      tags: [me]
      operationId: listMyProfiles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 소유한 프로필 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/SavedParentProfile' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [me]
      operationId: createMyProfile
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ParentProfileWrite' }
      responses:
        '201': { $ref: '#/components/responses/SavedParentProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/profiles/{profileId}:
    get:
      tags: [me]
      operationId: getMyProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses:
        '200': { $ref: '#/components/responses/SavedParentProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [me]
      operationId: updateMyProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      requestBody: { $ref: '#/components/requestBodies/ParentProfileWrite' }
      responses:
        '200': { $ref: '#/components/responses/SavedParentProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [me]
      operationId: deleteMyProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses:
        '204': { description: 삭제 완료 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/me/saved-benefits:
    get:
      tags: [me]
      operationId: listSavedBenefits
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 저장한 혜택 ID 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { type: integer, format: int64 } }
    post:
      tags: [me]
      operationId: saveBenefit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [benefitId]
              properties:
                benefitId: { type: integer, format: int64 }
      responses:
        '204': { description: 저장 완료 }

  /api/me/saved-benefits/{benefitId}:
    delete:
      tags: [me]
      operationId: unsaveBenefit
      security: [{ bearerAuth: [] }]
      parameters:
        - name: benefitId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 저장 해제 }

  /api/me/notification-settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/NotificationSettings' }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200': { $ref: '#/components/responses/NotificationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/chat:
    post:
      tags: [chat]
      operationId: askChat
      security: [{ bearerAuth: [] }]
      summary: 공개 혜택만 근거로 답변
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: 근거가 없으면 answer는 모름, sources는 빈 배열
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ChatAnswer' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    admin:
      type: http
      scheme: bearer
      description: JWT의 ADMIN 역할 필요

  requestBodies:
    ParentProfileWrite:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ParentProfileWrite' }

  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Age:
      name: age
      in: query
      schema: { type: integer, minimum: 0, maximum: 120, example: 78 }
    CtpvName:
      name: ctpvName
      in: query
      description: 시도 정식 명칭 (`/api/regions` 값)
      schema: { type: string, example: 서울특별시 }
    SggName:
      name: sggName
      in: query
      description: 시군구 명칭. `ctpvName`과 함께 쓴다
      schema: { type: string, example: 강서구 }
    LtcGrade:
      name: ltcGrade
      in: query
      description: 장기요양 등급 1~5, 6 = 인지지원등급
      schema: { type: integer, minimum: 1, maximum: 6 }
    IncomeMedianPct:
      name: incomeMedianPct
      in: query
      description: 가구 소득이 기준 중위소득의 몇 %인지
      schema: { type: integer, minimum: 0, maximum: 1000, example: 45 }
    ReviewId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    AuthSuccess:
      description: 액세스 토큰 JSON 및 HttpOnly 리프레시 쿠키
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthToken' }
    SavedParentProfile:
      description: 저장한 프로필
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/SavedParentProfile' }
    NotificationSettings:
      description: 알림 설정
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/NotificationSettings' }
    BadRequest:
      description: 요청 값 오류 (`INVALID_REQUEST`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
          example:
            success: false
            data: null
            error:
              code: INVALID_REQUEST
              message: 요청 값이 올바르지 않습니다.
              fieldErrors:
                - { field: age, message: 0 이상 120 이하여야 합니다. }
    NotFound:
      description: 대상 없음 (`BENEFIT_NOT_FOUND`, `REVIEW_NOT_FOUND`, `NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
          example:
            success: false
            data: null
            error: { code: BENEFIT_NOT_FOUND, message: 혜택을 찾을 수 없습니다., fieldErrors: [] }
    Conflict:
      description: 이미 처리된 검토 항목 (`REVIEW_ALREADY_RESOLVED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Unauthorized:
      description: 로그인 필요 (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Forbidden:
      description: 권한 없음 (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }

  schemas:
    Me:
      type: object
      required: [id, displayName, email, role]
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        role: { type: string, enum: [USER, ADMIN] }
    AuthToken:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: 초, example: 900 }
        user: { $ref: '#/components/schemas/Me' }
    ParentProfileWrite:
      allOf:
        - $ref: '#/components/schemas/ParentProfile'
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
    SavedParentProfile:
      allOf:
        - $ref: '#/components/schemas/ParentProfileWrite'
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
    NotificationSettings:
      type: object
      required: [emailEnabled, newBenefitEnabled, deadlineEnabled, deadlineDays]
      properties:
        emailEnabled: { type: boolean }
        newBenefitEnabled: { type: boolean }
        deadlineEnabled: { type: boolean }
        deadlineDays: { type: integer, minimum: 1, maximum: 30 }
    ChatSource:
      type: object
      required: [benefitId, name, sourceUrl, basis]
      properties:
        benefitId: { type: integer, format: int64 }
        name: { type: string }
        sourceUrl: { type: string, format: uri }
        basis: { $ref: '#/components/schemas/Basis' }
    ChatAnswer:
      type: object
      required: [answer, sources, mock]
      properties:
        answer: { type: string, description: 근거 없으면 모름 }
        sources: { type: array, items: { $ref: '#/components/schemas/ChatSource' } }
        mock: { type: boolean, description: 가짜 구현 사용 여부 }
    ApiResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean }
        data: {}
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: 'null'

    ErrorBody:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          description: 기계용 코드
          enum: [INVALID_REQUEST, BENEFIT_NOT_FOUND, REVIEW_NOT_FOUND, NOT_FOUND, REVIEW_ALREADY_RESOLVED, UNAUTHORIZED, FORBIDDEN, INTERNAL_ERROR]
        message: { type: string, description: 사용자에게 보여줄 수 있는 한국어 메시지 }
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, description: 0부터 }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Source:
      type: string
      enum: [NATIONAL, LOCAL, GOV24]
      description: NATIONAL = 복지로 중앙부처, LOCAL = 복지로 지자체, GOV24 = 정부24 공공서비스

    Code:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }

    Tag:
      type: object
      required: [type, code, name]
      properties:
        type: { type: string, enum: [LIFE, HOUSEHOLD, THEME] }
        code: { type: string, example: '006' }
        name: { type: string, example: 노년 }

    Region:
      type: object
      required: [ctpvName, sggName]
      properties:
        ctpvName: { type: string, example: 전남광주통합특별시 }
        sggName: { type: [string, 'null'], example: 보성군, description: null이면 시도 전체 사업 }

    Basis:
      type: object
      description: 기준일 정보. 화면에는 `lastCollectedAt`을 "기준일"로 보여준다.
      required: [lastCollectedAt, sourceModifiedAt, baseYear, updatePending]
      properties:
        lastCollectedAt: { type: string, format: date-time, description: 우리가 원천에서 마지막으로 확인한 시각 }
        sourceModifiedAt: { type: [string, 'null'], format: date-time, description: 원천이 알려준 최종 수정 시각 }
        baseYear: { type: [integer, 'null'], description: 원천 기준연도 (중앙부처만) }
        updatePending: { type: boolean, description: 원문이 바뀌어 재검증 중. "정보 갱신 확인 중" 표시 }

    Eligibility:
      type: object
      description: 확정된 자격 조건. **null = 조건 없음(원문에 언급 없음)**
      required: [minAge, maxAge, ltcRequired, ltcGrades, incomeMaxMedianPct, requiresBasicLivelihood, requiresNearPoverty, requiresBasicPension, requiresDisability, requiresVeteran, requiresSingleHousehold, conditionsSummary]
      properties:
        minAge: { type: [integer, 'null'], minimum: 0, maximum: 120 }
        maxAge: { type: [integer, 'null'], minimum: 0, maximum: 120 }
        ltcRequired: { type: [boolean, 'null'], description: 'true = 장기요양 등급이 있어야 함. false = 등급이 있으면 대상 아님(장기요양 수급자 제외 사업). null = 무관' }
        ltcGrades:
          type: [array, 'null']
          items: { type: integer, minimum: 1, maximum: 6 }
          description: 허용 등급. 6 = 인지지원등급. null이면 등급 무관
        incomeMaxMedianPct: { type: [integer, 'null'], description: 기준 중위소득 % 상한 }
        requiresBasicLivelihood: { type: [boolean, 'null'], description: 기초생활수급자여야 함 }
        requiresNearPoverty: { type: [boolean, 'null'], description: 차상위계층이어야 함 }
        requiresBasicPension: { type: [boolean, 'null'], description: 기초연금 수급자여야 함 }
        requiresDisability: { type: [boolean, 'null'] }
        requiresVeteran: { type: [boolean, 'null'] }
        requiresSingleHousehold: { type: [boolean, 'null'], description: 1인 가구(독거)여야 함 }
        conditionsSummary: { type: [string, 'null'], description: "조건 한 줄 요약 (AI 생성, 검증됨)" }

    BenefitSummary:
      type: object
      required: [id, groupId, name, summary, source, sourceUrl, agencyName, region, provisionType, supportCycle, onlineApply, tags, eligibility, basis]
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        name: { type: string }
        summary: { type: [string, 'null'] }
        source: { $ref: '#/components/schemas/Source' }
        sourceUrl: { type: string, format: uri, description: 출처 (복지로·정부24 상세 페이지) }
        agencyName: { type: [string, 'null'], description: 소관기관 }
        region:
          oneOf:
            - $ref: '#/components/schemas/Region'
            - type: 'null'
          description: null이면 전국 사업
        provisionType: { type: [string, 'null'], example: 현금지급 }
        supportCycle: { type: [string, 'null'], example: 월 }
        onlineApply: { type: [boolean, 'null'] }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        eligibility: { $ref: '#/components/schemas/Eligibility' }
        basis: { $ref: '#/components/schemas/Basis' }

    Reference:
      type: object
      required: [name, value]
      properties:
        name: { type: [string, 'null'], example: 보건복지부 콜센터 }
        value: { type: [string, 'null'], example: '129', description: "전화번호, URL, 설명 등" }

    BenefitDetail:
      allOf:
        - $ref: '#/components/schemas/BenefitSummary'
        - type: object
          required: [targetContent, criteriaContent, benefitContent, applyContent, enforceStartDate, enforceEndDate, contact, references, otherSources]
          properties:
            targetContent: { type: [string, 'null'], description: 지원대상 원문 }
            criteriaContent: { type: [string, 'null'], description: 선정기준 원문 }
            benefitContent: { type: [string, 'null'], description: 지원내용 원문 }
            applyContent: { type: [string, 'null'], description: 신청방법 원문 }
            enforceStartDate: { type: [string, 'null'], format: date }
            enforceEndDate: { type: [string, 'null'], format: date, description: null이면 기한 없음 }
            contact: { type: [string, 'null'], description: 대표 문의처 }
            references:
              type: object
              required: [CONTACT, SITE, LAW, FORM, APPLY]
              properties:
                CONTACT: { type: array, items: { $ref: '#/components/schemas/Reference' } }
                SITE: { type: array, items: { $ref: '#/components/schemas/Reference' } }
                LAW: { type: array, items: { $ref: '#/components/schemas/Reference' } }
                FORM: { type: array, items: { $ref: '#/components/schemas/Reference' } }
                APPLY: { type: array, items: { $ref: '#/components/schemas/Reference' } }
            otherSources:
              type: array
              description: 같은 그룹의 다른 원천 (출처 여러 개 표시용)
              items:
                type: object
                required: [id, source, name, sourceUrl]
                properties:
                  id: { type: integer, format: int64 }
                  source: { $ref: '#/components/schemas/Source' }
                  name: { type: string }
                  sourceUrl: { type: string, format: uri }

    ParentProfile:
      type: object
      required: [age, ctpvName]
      description: 모르는 항목은 null로 보낸다(조건이 있는 혜택은 CHECK_NEEDED로 표시됨).
      properties:
        age: { type: integer, minimum: 0, maximum: 120 }
        ctpvName: { type: string, description: 거주 시도 }
        sggName: { type: [string, 'null'], description: 거주 시군구 }
        ltcGrade: { type: [integer, 'null'], minimum: 1, maximum: 6, description: '장기요양 등급 (6 = 인지지원등급)' }
        hasNoLtcGrade:
          type: [boolean, 'null']
          description: |
            true = 등급이 없다고 확실히 앎. 장기요양 상태는 세 가지다.
            - ltcGrade 있음 → 해당 등급
            - ltcGrade null + hasNoLtcGrade true → 등급 없음 (등급 필요 혜택은 제외)
            - 둘 다 null → 모름 (등급 필요 혜택은 CHECK_NEEDED)
        incomeMedianPct: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
        basicLivelihood: { type: [boolean, 'null'], description: 기초생활수급자 }
        nearPoverty: { type: [boolean, 'null'], description: 차상위계층 }
        basicPension: { type: [boolean, 'null'], description: 기초연금 수급 }
        disability: { type: [boolean, 'null'], description: 등록 장애인 }
        veteran: { type: [boolean, 'null'], description: 국가보훈대상자 }
        livingAlone: { type: [boolean, 'null'], description: 1인 가구(독거) }

    MatchResult:
      type: object
      required: [benefit, matchLevel, checkItems]
      properties:
        benefit: { $ref: '#/components/schemas/BenefitSummary' }
        matchLevel: { type: string, enum: [ELIGIBLE, CHECK_NEEDED] }
        checkItems:
          type: array
          description: CHECK_NEEDED일 때 확인할 조건 (사용자에게 보여줄 문장)
          items: { type: string, example: 기초연금 수급 여부를 확인하세요. }

    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, RESOLVED]

    ReviewReason:
      type: string
      enum: [MODEL_MISMATCH, SCHEMA_INVALID, STRUCTURED_MISMATCH, GROUP_CANDIDATE, SOURCE_REMOVED, OTHER]

    ReviewSummary:
      type: object
      required: [id, benefitId, benefitName, source, reason, status, createdAt, resolvedAt, resolvedBy]
      properties:
        id: { type: integer, format: int64 }
        benefitId: { type: integer, format: int64 }
        benefitName: { type: string }
        source: { $ref: '#/components/schemas/Source' }
        reason: { $ref: '#/components/schemas/ReviewReason' }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { type: [string, 'null'] }

    Extraction:
      type: object
      required: [id, provider, model, promptVersion, schemaValid, result, errorMessage, createdAt]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string, enum: [CLAUDE, GPT] }
        model: { type: string }
        promptVersion: { type: string }
        schemaValid: { type: boolean }
        result: { type: [object, 'null'], description: 모델이 낸 JSON 그대로 }
        errorMessage: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    ReviewDetail:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          required: [sourceUrl, sourceText, currentEligibility, extractions, differences, groupCandidate, resolutionNote]
          properties:
            sourceUrl: { type: string, format: uri }
            sourceText:
              type: object
              description: AI 입력이 된 원문 필드 (지원대상, 선정기준 등)
              additionalProperties: { type: string }
            currentEligibility:
              oneOf:
                - $ref: '#/components/schemas/Eligibility'
                - type: 'null'
              description: 현재 공개 중인 확정 조건 (없으면 null)
            extractions: { type: array, items: { $ref: '#/components/schemas/Extraction' } }
            differences:
              type: array
              description: 두 모델(또는 모델과 구조화 필드) 값이 다른 항목
              items:
                type: object
                required: [field, claude, gpt, structured]
                properties:
                  field: { type: string, example: minAge }
                  claude: {}
                  gpt: {}
                  structured: { description: API 구조화 필드 값 (없으면 null) }
            groupCandidate:
              type: [object, 'null']
              description: GROUP_CANDIDATE일 때 병합 대상
              properties:
                targetBenefitId: { type: integer, format: int64 }
                targetName: { type: string }
                targetSource: { $ref: '#/components/schemas/Source' }
                method: { type: string, enum: [NAME_EXACT, NAME_SIMILAR, AI] }
                score: { type: [number, 'null'] }
            resolutionNote: { type: [string, 'null'] }
