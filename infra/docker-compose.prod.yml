# 단일 서버 운영 프로필. 로컬 HTTP 8088, AWS HTTPS는 docker-compose.https.yml 추가.
name: silverhelper-hosting
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-silverhelper}
      POSTGRES_USER: ${DB_USERNAME:-silverhelper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: silverhelper-backend:local
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private]

  web:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    image: silverhelper-web:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy.conf:/etc/nginx/proxy.conf:ro
    depends_on: [backend]
    networks: [private]

networks:
  private:

volumes:
  postgres-data:
  redis-data:
