# Apply after certificates and a domain are ready on the AWS host.
services:
  web:
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "443:443"
    volumes:
      - ./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR in infra/.env}:/etc/nginx/tls:ro
      - ${ACME_WEBROOT_DIR:?Set ACME_WEBROOT_DIR in infra/.env}:/var/www/acme:ro
