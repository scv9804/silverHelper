server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/live/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/live/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 10m;

    location = /swagger-ui.html { return 404; }
    location ^~ /swagger-ui/ { return 404; }
    location = /v3/api-docs { return 404; }
    location ^~ /v3/api-docs/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location = /actuator/health {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy.conf;
    }
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy.conf;
    }
    location ^~ /oauth2/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy.conf;
    }
    location ^~ /login/oauth2/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy.conf;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
