name: Deploy (AWS 준비 시)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      backend_ready: ${{ steps.check.outputs.backend_ready }}
      frontend_ready: ${{ steps.check.outputs.frontend_ready }}
    steps:
      - name: Check deployment secrets
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [[ -n "$AWS_ROLE_ARN" && -n "$AWS_REGION" && -n "$ECR_REPOSITORY" && -n "$EC2_INSTANCE_ID" ]]; then
            echo 'backend_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend_ready=false' >> "$GITHUB_OUTPUT"
            echo 'Backend deploy skipped: AWS secrets are not configured.'
          fi
          if [[ -n "$AWS_ROLE_ARN" && -n "$AWS_REGION" && -n "$S3_BUCKET" && -n "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            echo 'frontend_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend_ready=false' >> "$GITHUB_OUTPUT"
            echo 'Frontend deploy skipped: AWS secrets are not configured.'
          fi

  backend:
    needs: preflight
    if: needs.preflight.outputs.backend_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy to EC2 through SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ env.image }}
        run: |
          COMMAND="cd /opt/silverhelper && aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin '$REGISTRY' && BACKEND_IMAGE='$IMAGE' docker compose -f infra/docker-compose.prod.yml up -d"
          PARAMS=$(jq -cn --arg command "$COMMAND" '{commands:[$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

  frontend:
    needs: preflight
    if: needs.preflight.outputs.frontend_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload and invalidate
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync frontend/dist "s3://$S3_BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
