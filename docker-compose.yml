# 로컬 개발용: DB, Redis, Mailpit을 컨테이너로 실행한다.
# 백엔드와 프론트엔드는 PC에서 직접 실행 (README 참고)
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: silverhelper-postgres
    environment:
      POSTGRES_DB: silverhelper
      POSTGRES_USER: silverhelper
      POSTGRES_PASSWORD: silverhelper
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silverhelper"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: silverhelper-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: silverhelper-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
