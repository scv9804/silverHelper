spring:
  application:
    name: silver-helper
  profiles:
    default: local
  config:
    # 루트의 .env 파일을 설정값으로 읽는다 (backend 폴더에서 실행 기준)
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:silverhelper}
    username: ${DB_USERNAME:silverhelper}
    password: ${DB_PASSWORD:silverhelper}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  batch:
    job:
      enabled: false # 배치는 스케줄러에서 명시적으로 실행
    jdbc:
      initialize-schema: always

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
